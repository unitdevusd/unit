<ion-header>
    <ion-toolbar>
        <div class="title-and-logo">           
            <div class="logo">
              <img src="../../../../assets/imgs/unit-logo.png" alt="Logo" style="width: 50px; height: auto;" />
            </div>
            <ion-title>Profile</ion-title>
          </div>

          <ion-avatar slot="end" style="width: 50px; height: 50px; cursor: pointer;">
            <ion-img (click)="openImageModal(profilePicture)" class="img-spacetype" [src]="profilePicture ? profilePicture : '../../../../assets/imgs/user.png'"></ion-img>
            </ion-avatar>

              
      <!-- <ion-buttons slot="end">
        <ion-button (click)="toggleDarkMode()">
          <ion-icon [name]="darkMode ? 'sunny' : 'moon'"></ion-icon>
        </ion-button>
      </ion-buttons> -->
    </ion-toolbar>
  </ion-header>
  
  <ion-content fullscreen [ngClass]="{'dark-theme': darkMode}">

    

    <ion-list>

      <ion-item lines="full">
        <ion-avatar slot="start" style="position: relative; display: flex; align-items:center;justify-content: center" >
          <ion-icon name="key" style="font-size: 22px; color: #ED1B25;" color="#ED1B25"></ion-icon>
        </ion-avatar>
        <ion-label>Referral Code - </ion-label>
        <b style="margin-left: 0; margin-right: 2px;">{{referralCode}}</b>
        <ion-icon name="copy-outline" slot="end" (click)="copyToClipboard(referralCode)" style="cursor: pointer;"></ion-icon>
            </ion-item>

      <ion-item lines="full">
        <ion-avatar slot="start" style="position: relative; display: flex; align-items:center;justify-content: center" >
          <ion-icon name="people" style="font-size: 22px; color: #ED1B25;" color="#ED1B25"></ion-icon> 
        </ion-avatar>
        <ion-label>Referrals</ion-label>
      </ion-item>
  
      <ion-item lines="full">
        <ion-avatar slot="start" style="position: relative; display: flex; align-items:center;justify-content: center" >
          <ion-icon name="document-text" style="font-size: 22px; color: #ED1B25;" color="#ED1B25"></ion-icon> <!-- Icon for Privacy Policy -->
        </ion-avatar>
        <ion-label>View Privacy policy</ion-label>
      </ion-item>
  
      <ion-item lines="full">
        <ion-avatar slot="start" style="position: relative; display: flex; align-items:center;justify-content: center" >
          <ion-icon name="briefcase" style="font-size: 22px; color: #ED1B25;" color="#ED1B25"></ion-icon>
        </ion-avatar>
        <ion-label>Consult a legal pro</ion-label>
      </ion-item>

      <ion-item lines="full">
        <ion-avatar slot="start" style="position: relative; display: flex; align-items:center;justify-content: center" >
          <ion-icon name="log-out" style="font-size: 22px; color: #ED1B25;" color="#ED1B25"></ion-icon>
        </ion-avatar>
        <ion-label (click)="logout()">Log out</ion-label>
      </ion-item>

  
      <ion-item lines="full">
        <ion-avatar slot="start" style="position: relative; display: flex; align-items:center;justify-content: center" >
          <ion-icon name="sync" style="font-size: 22px; color: #ED1B25;" color="#ED1B25"></ion-icon> 
        </ion-avatar>
        <ion-toggle *ngIf="userDetails?.role !== null && userDetails?.role == 'HOST'" [(ngModel)]="hostToggle" (ionChange)="toggleRole('HOST')">Switch to Dancer</ion-toggle>
        <ion-toggle *ngIf="userDetails?.role !== null && userDetails?.role == 'TENANT'" [(ngModel)]="tenantToggle" (ionChange)="toggleRole('TENANT')">Switch to Host</ion-toggle><br /><br />
    </ion-item>

    <ion-item lines="full">
      <ion-avatar slot="start" style="position: relative; display: flex; align-items:center;justify-content: center" >
        <ion-icon name="finger-print-outline" style="font-size: 22px; color: #ED1B25;" color="#ED1B25"></ion-icon> 
      </ion-avatar>
      <ion-toggle [(ngModel)]="biometrics" (ionChange)="toggleBiometrics()">Biometrics</ion-toggle>
  </ion-item>


      </ion-list>
 
    </ion-content>
