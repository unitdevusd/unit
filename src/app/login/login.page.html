<ion-content fullscreen class="ion-padding">
    <div class="container">
      <div class="logo">
        <img src="../../../../assets/imgs/unit-logo.png">
      </div>
      <div class="form-container">
       <div class="message" style="color: red; font-size: 12px;"> {{ message }} </div>
        <form class="form" [formGroup]="loginForm" (submit)="loginUser()">
          <ion-list mode="md">
            <ion-item mode="md">
              <ion-input id="email" placeholder="Email Address" type="email" formControlName="email"></ion-input>
            </ion-item>
          </ion-list>
          <ion-list mode="md">
            <ion-item mode="md">
              <ion-input id="pass" type="password" placeholder="Password" formControlName="password"></ion-input>
            </ion-item>
          </ion-list>
          <div class="forgot-pass">
            <a routerLink="/forgot-password">Forgot Password?</a>
          </div>

          <ion-button class="button-h" fill="solid" size="default" expand="block" color="custom" style="--ion-color-base: #e40e40; margin-top: 10% !important; --border-radius: 4px;"
          [disabled]="!loginForm.valid" type="submit">
           Login
          </ion-button>

          <div class="fingerprint-container">
            <ion-icon
              *ngIf="available"
              (click)="handleFingerprintScan()"
              name="finger-print-outline"
              class="fingerprint-icon"
              style="cursor: pointer; font-size: 50px;"
            ></ion-icon>
          </div>
    

          <!-- <ion-button class="button-h custom-cursor" fill="solid" size="default" shape="round" expand="block" color="primary" [disabled]="!loginForm.valid" (click)="loginUser()">Login</ion-button> -->
          <p class="have">Don't have an account? <br><a style="color: #e40e40;" class="signup-text" (click)="registerpage()"> Sign up </a></p>
        </form>
      </div>
    </div>
  </ion-content>
