<ion-list class="card-list" *ngIf="units && units?.length > 0; else noUnits">
    <ion-item class="card-item"  *ngFor="let item of units" (click)="place(item)"
    >

    <ion-grid class="card-grid" style="width: 312px !important; height: auto !important;">
          <ion-card class="card_features ion-no-padding">
            <img class="img-spacetype" *ngIf="item?.images !== null; else noimage" [src]="item.spaceImage" style="border-radius: 10px;" />
            <ng-template #noimage>
              <img src="../../../../assets/imgs/dummy_space1.png" />
            </ng-template>
            <ion-card-header>
              <ion-card-subtitle style="font-size: 14px;">{{item?.spotName}}, {{item?.spaceLocation}}</ion-card-subtitle>
            </ion-card-header>
            <ion-card-content class="no-padding">
              <div class="card-content" style="display: flex; margin-top: 0; font-size: 12px; color: #6F6F6F !important;">
                <div class="floor-type" style="margin-right: 10px;">
                  <ion-avatar slot="start" style="width: 50px; height: 50px;">
                    <ion-img class="host-image" [src]="item.profilePicture ? item.profilePicture : '../../../../assets/imgs/user.png'"></ion-img>
                    </ion-avatar>        
                </div>
                
                <div class="charges" style="width: 100%;">
                  <ion-card-title style="font-size: 13px;"> Hosted by {{item?.hostFullName}}</ion-card-title>
                  <ion-card-title style="font-size: 13px;"> Fits 1 - {{item?.size}} dancers</ion-card-title>
                  <span>$</span><b>{{item?.chargePerDay}} per {{ item?.hourlyCharges ? 'hour' : 'day' }}</b>
      
              </div>
                <div class="floor-type">
                  <ion-img
                  style="width: 48px; height: 48px;"
                  [src]="'../../../../assets/floors/' + item?.spaceType + '.png'"
                  alt="Logo">
                </ion-img>
                               <!-- <ion-icon style="right: 0;" slot="end" size="large" name="layers-outline" color="dark" style="font-size: 20px;" class="mr-l"></ion-icon> -->
              </div>

              </div>
            </ion-card-content>
          </ion-card>
    </ion-grid>
    </ion-item>
    </ion-list>



<ng-template #noUnits>

  <div class="centered-container">
  <img class="img-spacetype-unit" src="../../../../assets/imgs/idle_image.jpg" />
  </div>

  <div class="no-item-unit">
    <p style="text-align: center;"><b><h5>No Spots around you</h5></b></p>
  </div>
</ng-template>
